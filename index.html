<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali-Style Security Reference Hub</title>
    <!-- Google Fonts: Fira Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <!-- High-Fidelity Custom Kali-Inspired Dragon SVG Logo -->
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="kali-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00a8ff" />
                                <stop offset="50%" stop-color="#0066cc" />
                                <stop offset="100%" stop-color="#0a1530" />
                            </linearGradient>
                        </defs>
                        <!-- Dragon Silhouette path -->
                        <path d="M 50 10 C 45 25 30 30 20 40 C 15 45 10 55 15 65 C 20 75 35 80 50 90 C 45 80 40 70 45 60 C 48 53 55 50 60 48 C 65 46 72 48 78 45 C 85 42 90 35 85 28 C 80 20 70 18 60 22 C 55 24 52 28 50 32 C 48 24 45 15 50 10 Z M 52 38 C 55 38 58 40 58 43 C 58 46 54 48 51 48 C 48 48 45 45 46 42 C 47 39 49 38 52 38 Z" fill="url(#kali-blue-grad)"/>
                        <!-- Tail sweep/wings -->
                        <path d="M 25 55 C 28 62 35 68 45 72 C 35 74 25 70 20 62 C 18 58 19 50 25 55 Z" fill="#00a8ff" opacity="0.8"/>
                        <path d="M 75 35 C 72 28 65 22 55 18 C 65 16 75 20 80 28 C 82 32 81 40 75 35 Z" fill="#00c0ff" opacity="0.9"/>
                    </svg>
                    <span class="logo-text">KALI-HUB</span>
                </div>
                <span class="logo-subtitle">Manual Técnico & Auditoría</span>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-label">Herramientas</div>
                <button class="nav-item active" data-tool="nmap">
                    <span class="nav-indicator"></span>
                    <!-- Kali Terminal Icon -->
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span class="nav-name">Nmap Auditing</span>
                    <span class="nav-tag">Escaneo</span>
                </button>
                <button class="nav-item" data-tool="wireless">
                    <span class="nav-indicator"></span>
                    <!-- WiFi Wireless Signal Icon -->
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7.5 7.5 0 010 10m-2.236-8.944a5 5 0 010 7.888m-2.237-6.833a2.5 2.5 0 010 3.778M12 12h.01" />
                    </svg>
                    <span class="nav-name">Aircrack Suite</span>
                    <span class="nav-tag">WiFi Audit</span>
                </button>
                <button class="nav-item" data-tool="wireshark">
                    <span class="nav-indicator"></span>
                    <!-- Shield Search Packets Icon -->
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span class="nav-name">Wireshark & Tshark</span>
                    <span class="nav-tag">Paquetes</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="kali-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Consola de Referencia</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header / Topbar -->
            <header class="topbar">
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar comandos, errores o parámetros de evasión...">
                </div>
                <div class="topbar-actions">
                    <span class="repo-badge">KALI v2026.1</span>
                </div>
            </header>

            <!-- Tool Content Container -->
            <div id="content-area" class="content-area">
                <!-- Content injected dynamically via JS -->
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <svg class="toast-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toast-message">Copiado al portapapeles</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
